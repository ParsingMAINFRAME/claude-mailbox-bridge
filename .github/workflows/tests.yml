name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helper:
    # The Python helper only. The mod's own tests (`claude plugin validate mod`,
    # `claude plugin test mod`) need the Claude Code CLI and are run locally, not here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 test_bridge.py
